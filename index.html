.bars .i{background:var(--ac)}.bars .e{background:var(--wa)}.col small{color:var(--mu)}

label{display:flex;flex-direction:column;gap:4px;color:var(--mu);font-size:12px;margin-bottom:10px}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx)}
.ov{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:9}.mo{width:min(420px,100%);max-height:90vh;overflow:auto}
.mo h2{margin-bottom:12px}.ac{display:flex;gap:8px;justify-content:flex-end}

dash(){const T=tot(),ms=[...Array(6)].map((_,k)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+k);return d.getFullYear()+'-'+p2(d.getMonth()+1)}),D=ms.map(m=>tot(m+'-01',m+'-31')),mx=Math.max(1,...D.map(x=>Math.max(x.inc,x.exp)));

a.innerHTML=`<div class=app><aside><div class=lg>Fin<b>CRM</b></div>${NAV.filter(n=>n[2].includes(U.r)).map(n=>`<button data-a=nav data-p=${n[0]} class="${n[0]==pg?'on':''}">${t(n[1])}</button>`).join('')}<div class=us>${U.n} · ${t('r_'+U.r)}<br><button data-a=logout>${t('logout')}</button>${U.r=='a'?`<br><button data-a=reset>${t('reset')}</button>`:''}</div></aside><main><header><h1>${t(NAV.find(n=>n[0]==pg)[1])}</h1>${LB()}</header>${P[pg]()}</main></div>`}
const FD={cl:()=>[['name','text','name'],['nip','text','nip'],['email','text','email'],['city','text','city']],
inv:()=>[['cl','select','client',S.cl.map(c=>[c.id,c.name])],['date','date','date'],['due','date','due'],['net','number','net']],
pay:()=>[['inv','select','invoice',S.inv.filter(i=>stOf(i)!='paid').map(i=>[i.id,i.no+' · '+fm(left(i))])],['date','date','date'],['amt','number','amount']],
tx:()=>[['type','select','type',[['i',t('inc')],['e',t('exp')]]],['date','date','date'],['desc','text','desc'],['amt','number','amount']],
ct:()=>[['no','text','no'],['cl','select','client',S.cl.map(c=>[c.id,c.name])],['date','date','date'],['val','number','value']]};
let M=null;
function openForm(en,id,pre){const o=id?S[en].find(x=>x.id==id):Object.assign({date:today(),due:add(today(),14),type:'e'},pre||{});M={en,id};
$('#md').innerHTML=`<div class=ov><form id=mf class="card mo"><h2>${t(id?'edit':'add')}: ${t(TT[en])}</h2>${FD[en]().map(([k,ty,lb,op])=>`<label>${t(lb)}${ty=='select'?`<select name=${k}>${op.map(([v,l])=>`<option value="${v}"${v==o[k]?' selected':''}>${esc(l)}</option>`).join('')}</select>`:`<input name=${k} type=${ty} value="${esc(o[k]??'')}" ${ty=='number'?'step=0.01 min=0.01':''} required>`}</label>`).join('')}<div class=ac><button type=button class=btn2 data-a=close>${t('cancel')}</button><button class=btn>${t('save')}</button></div></form></div>`}
function saveForm(f){const v=Object.fromEntries(new FormData(f)),{en,id}=M;['cl','inv'].forEach(k=>{if(v[k]!==undefined)v[k]=+v[k]});['net','amt','val'].forEach(k=>{if(v[k]!==undefined)v[k]=parseFloat(v[k])});
if(en=='mat'||en=='in'||en=='out')return saveMg(v,en,id);if(id)Object.assign(S[en].find(x=>x.id==id),v);else{if(en=='inv'){const ym=v.date.slice(0,7);v.no=`FV/${ym.slice(0,4)}/${ym.slice(5)}/${p2(S.inv.filter(i=>i.date.startsWith(ym)).length+1).padStart(3,'0')}`}S[en].push({id:nid(S[en]),...v})}
save();M=null;$('#md').innerHTML='';render()}
function toast(m){const e=$('#toast');e.textContent=m;e.className='on';setTimeout(()=>e.className='',2200)}
const A={nav:(i,e,b)=>{pg=b.dataset.p;render()},lang:(i,e,b)=>{L=+b.dataset.l;document.documentElement.lang=LN[L];$('#md').innerHTML='';render()},form:(id,en)=>openForm(en,id),
pay:id=>{const i=S.inv.find(x=>x.id==id);openForm('pay',0,{inv:id,amt:left(i)})},close:()=>{$('#md').innerHTML=''},logout:()=>{U=null;render()},reset:()=>{S=seed();demoMag();save();render()},print:()=>{try{window.print()}catch(e){}},
del:(id,en)=>{if(S.mv.some(m=>en=='mat'?m.mat==id:en=='cl'?m.cl==id:en=='ct'&&m.ct==id))return toast(t('blockedm'));if(en=='cl'&&(S.inv.some(i=>i.cl==id)||S.ct.some(c=>c.cl==id)))return toast(t('blocked'));if(en=='inv')S.pay=S.pay.filter(p=>p.inv!=id);S[en]=S[en].filter(x=>x.id!=id);save();render()}};
/* ===== Magazyn ===== */
function mvAdd(en,mid,date,q,pr,cl,ct){const m=S.mat.find(x=>x.id==mid);q=r2(q);if(!m||!(q>0)||(en=='out'&&q>m.qty))return false;
const mv={id:nid(S.mv),date,mat:m.id,type:en,qty:q};
if(en=='in'){pr=r2(pr);m.price=(m.qty*m.price+q*pr)/(m.qty+q);m.qty=r2(m.qty+q);mv.price=pr;mv.tx=nid(S.tx);S.tx.push({id:mv.tx,date,type:'e',mat:m.id,desc:'Magazyn: '+m.name+' × '+q,amt:r2(q*pr)})}
else{mv.price=m.price;m.qty=r2(m.qty-q);mv.cl=cl;mv.ct=ct||0}
S.mv.push(mv);return true}
function saveMg(v,en,id){if(en=='mat'){v.price=parseFloat(v.price);if(id)Object.assign(S.mat.find(x=>x.id==id),v);else S.mat.push({id:nid(S.mat),qty:0,...v})}
else if(!mvAdd(en,+v.mat,v.date,parseFloat(v.qty),parseFloat(v.price),+v.cl,+v.ct))return toast(t('nostock'));
save();M=null;$('#md').innerHTML='';render()}
function demoMag(){const d=today();S.mat=[{id:1,name:'Kabel sieciowy Cat6 (5 m)',price:0,qty:0},{id:2,name:'Toner do drukarki',price:0,qty:0},{id:3,name:'Papier A4 (ryza)',price:0,qty:0}];S.mv=[];
[['in',1,-28,20,10],['in',2,-26,10,120],['in',3,-24,50,18],['out',1,-20,5,0,1,1],['out',3,-15,10,0,3,0],['out',2,-9,2,0,4,2],['in',3,-6,40,20],['out',2,-4,1,0,2,0]].forEach(o=>mvAdd(o[0],o[1],add(d,o[2]),o[3],o[4],o[5],o[6]))}
const mn=id=>(S.mat.find(m=>m.id==id)||{name:'—'}).name,stv=()=>sum(S.mat.map(m=>r2(m.qty*m.price))),mvv=ty=>sum(S.mv.filter(m=>m.type==ty).map(m=>r2(m.qty*m.price)));
let mt='prod';const MT=[['prod','prod'],['in','recv_m'],['out','issue_m'],['hist','hist']];
FD.mat=()=>[['name','text','name'],['price','number','mprice']];
FD['in']=()=>[['mat','select','mat',S.mat.map(m=>[m.id,m.name])],['date','date','date'],['qty','number','qty'],['price','number','mprice']];
FD.out=()=>[['mat','select','mat',S.mat.filter(m=>m.qty>0).map(m=>[m.id,m.name+' · '+m.qty])],['date','date','date'],['qty','number','qty'],['cl','select','client',S.cl.map(c=>[c.id,c.name])],['ct','select','contract',[[0,'—']].concat(S.ct.map(c=>[c.id,c.no+' · '+cn(c.cl)]))]];
const mc=(m,k)=>({date:fd(m.date),type:`<span class="b ${m.type=='in'?'paid':'partial'}">${t('mv_'+m.type)}</span>`,mat:esc(mn(m.mat)),qty:(m.type=='in'?'+':'−')+m.qty,up:fm(m.price),val:fm(r2(m.qty*m.price)),cl:m.cl?esc(cn(m.cl)):'—',ct:m.ct?esc((S.ct.find(c=>c.id==m.ct)||{no:'—'}).no):'—'}[k]);
const mtb=(h,ks,ty)=>tb(h,[...S.mv].filter(m=>!ty||m.type==ty).sort((a,b)=>b.date<a.date?-1:b.date>a.date?1:b.id-a.id).map(m=>ks.map(k=>mc(m,k))));
P.mag=()=>{const tabs=`<div class=lang style="margin-bottom:14px">${MT.map(([k,l])=>`<button data-a=mt data-k=${k} class="${k==mt?'on':''}">${t(l)}</button>`).join('')}</div>`,
kps=`<div class=kp>${kp(t('stockv'),fm(stv()))}${kp(t('mv_in'),fm(mvv('in')))}${kp(t('mv_out'),fm(mvv('out')))}</div>`;let b;
if(mt=='prod')b=bar('prod',addb('mat'))+tb(['mat','uprice','qty','mval',''],S.mat.map(m=>[esc(m.name),fm(m.price),m.qty,fm(r2(m.qty*m.price)),`<button class=lk data-a=mg data-k=in data-id=${m.id}>${t('mv_in')}</button>`+(m.qty>0?`<button class=lk data-a=mg data-k=out data-id=${m.id}>${t('mv_out')}</button>`:'')+act('mat',m.id)]));
else if(mt=='in')b=bar('recv_m',addb('in'))+mtb(['date','mat','qty','uprice','mval'],['date','mat','qty','up','val'],'in');
else if(mt=='out')b=bar('issue_m',addb('out'))+mtb(['date','mat','qty','uprice','mval','client','contract'],['date','mat','qty','up','val','cl','ct'],'out');
else b=bar('hist')+mtb(['date','type','mat','qty','mval','client','contract'],['date','type','mat','qty','val','cl','ct']);
return kps+tabs+b};
const rep0=P.rep;P.rep=()=>{const a=S.mv.filter(m=>(!R.f||m.date>=R.f)&&(!R.t||m.date<=R.t)),v=ty=>sum(a.filter(m=>m.type==ty).map(m=>r2(m.qty*m.price)));
return rep0()+bar('mrep')+tb(['desc','amount'],[[t('mv_in'),fm(v('in'))],[t('mv_out'),fm(v('out'))],[t('stockv'),fm(stv())]])+tb(['date','type','mat','qty','mval','client'],a.map(m=>['date','type','mat','qty','val','cl'].map(k=>mc(m,k))))};
A.mt=(i,e,b)=>{mt=b.dataset.k;render()};A.mg=(id,e,b)=>openForm(b.dataset.k,0,{mat:id,price:(S.mat.find(m=>m.id==id)||{}).price});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a](+b.dataset.id||0,b.dataset.e,b)});
document.addEventListener('change',e=>{if(e.target.id=='rf'||e.target.id=='rt'){R[e.target.id=='rf'?'f':'t']=e.target.value;render()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id=='mf')return saveForm(f);
const v=Object.fromEntries(new FormData(f)),x=US[v.u.trim().toLowerCase()];if(x&&x.p==v.p){U={n:v.u.trim().toLowerCase(),r:x.r};pg='dash';R={f:add(today(),-60),t:today()};render()}else toast(t('bad'))});
render();
</script></body></html>
